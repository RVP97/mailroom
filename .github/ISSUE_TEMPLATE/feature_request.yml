name: Feature request
description: Something you'd like Mailroom to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem or the job, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you picture it
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Another tool, a workaround, or not at all.
